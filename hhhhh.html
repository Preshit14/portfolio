<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Excuse Machine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;600&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff4d6;--ink:#231f3d;--card:#ffd84d;--pop:#ff5a3c;--popink:#fff;--mint:#7ad9b0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1933;--ink:#fff4d6;--card:#3a3470;--pop:#ff7a5c;--popink:#1c1933;--mint:#4fb58a}}
:root[data-theme="dark"]{--bg:#1c1933;--ink:#fff4d6;--card:#3a3470;--pop:#ff7a5c;--popink:#1c1933;--mint:#4fb58a}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:1.2rem}
main{width:min(34rem,100%)}
h1{font:400 clamp(2.2rem,9vw,3.4rem)/1 "Bowlby One",Impact,sans-serif;margin:0 0 .4rem;transform:rotate(-2deg)}
.sub{margin:0 0 1.4rem}
.card{background:var(--card);border:3px solid var(--ink);border-radius:1.2rem;box-shadow:7px 7px 0 var(--ink);padding:1.4rem;position:relative;min-height:15rem}
.mood{font-size:2.4rem;line-height:1}
#out{font:600 1.35rem/1.35 "DM Sans",system-ui,sans-serif;margin:.6rem 0 1rem;min-height:7rem}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
button{font:600 1rem "DM Sans",system-ui,sans-serif;border:3px solid var(--ink);border-radius:.8rem;padding:.7rem 1.1rem;cursor:pointer;color:var(--popink);background:var(--pop);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#doubt{background:var(--mint);color:var(--ink);position:relative;transition:transform .15s}
.meta{margin-top:1.1rem;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){#out.pop{animation:pop .25s}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body>
<main>
  <h1>The Excuse Machine</h1>
  <p class="sub">Late? Unprepared? Forgot your cousin’s wedding? Press the button. We’ll commit to the lie so you don’t have to.</p>
  <div class="card">
    <div class="mood" id="mood">🤔</div>
    <p id="out">Press the button to receive a totally believable excuse.</p>
    <div class="row">
      <button id="go">Make me an excuse</button>
      <button id="doubt">I don’t believe you</button>
    </div>
    <p class="meta" id="meta">Excuses issued: 0</p>
  </div>
</main>
<script>
const A=["I’m so sorry,","Honestly,","You won’t believe this, but","Long story short,","Please don’t be mad, but","Plot twist:"];
const B=["my cat accidentally joined a video call and got promoted","a pigeon stole my keys and I felt it was personal","my alarm clock went on strike","I got stuck in a revolving door for 40 minutes","my smart fridge locked me out of the kitchen","I was busy winning an argument with my GPS","a goose blocked the only path to my bike","I wore two different shoes and had to go home to process it","my houseplant needed emotional support","the elevator was playing the same song and I had to hear it out"];
const C=["so I’m legally allowed to be late.","and I have a note from the goose.","but I’m emotionally here.","and nobody has been the same since.","so really, this is the universe’s fault.","and I’d do it again.","but I brought snacks to make up for it."];
const M=["😅","🙃","🫠","🤥","😇","🦆","🫡"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let n=0,dodges=0;
const out=document.getElementById("out"),meta=document.getElementById("meta"),mood=document.getElementById("mood"),doubt=document.getElementById("doubt");
document.getElementById("go").addEventListener("click",()=>{
  n++;
  out.textContent=pick(A)+" "+pick(B)+", "+pick(C);
  out.classList.remove("pop");void out.offsetWidth;out.classList.add("pop");
  mood.textContent=pick(M);
  meta.textContent="Excuses issued: "+n+(n>=5?" (you might have a problem)":"");
});
function dodge(e){
  if(dodges>=5)return;
  dodges++;
  if(dodges>=5){doubt.style.transform="none";doubt.textContent="Fine. You win.";out.textContent="Okay, okay. Nothing was true. The goose is innocent.";mood.textContent="🏳️";return;}
  e.preventDefault();
  const x=(Math.random()-.5)*160,y=(Math.random()-.5)*120;
  doubt.style.transform="translate("+x+"px,"+y+"px) rotate("+(Math.random()*30-15)+"deg)";
  doubt.textContent=["Nope.","Too slow!","Missed me!","Almost!"][dodges-1]||"Nope.";
}
doubt.addEventListener("pointerenter",dodge);
doubt.addEventListener("touchstart",dodge,{passive:false});
</script>
</body>
</html>
